{% extends 'base.html' %}
{% load static %}
{% block title %}Configuración de la Cuenta{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Configuración de tu cuenta</h4>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                {% if user.firma_digital %}
                <div class="mt-3">
                    <label><strong>Firma digital actual:</strong></label><br>
                    <img src="{{ user.firma_digital.url }}" alt="Firma digital" 
                            class="img-thumbnail" style="max-height: 120px;">
                </div>
                {% endif %}

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
