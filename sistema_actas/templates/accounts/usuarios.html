{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Lista de Usuarios</h2>
    <ul>
        {% for u in usuarios %}
            <li>{{ u.username }} - {{ u.email }}</li>
        {% empty %}
            <li>No hay usuarios registrados.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
