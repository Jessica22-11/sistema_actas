{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --sena-green: #39A900; --sena-dark-green: #2B7A00;
            --sena-purple: #764ba2; --sena-blue: #667eea;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--sena-blue) 0%, var(--sena-purple) 100%) !important; 
            display: flex; align-items: center; justify-content: center; color: white; margin: 0;
        }
        .reset-card {
            background: white; color: #333; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); padding: 40px;
            max-width: 450px; width: 100%;
        }
        .form-control {
            border-radius: 10px; border: 1px solid #ced4da; padding: 0.75rem 1rem;
            background-color: white !important; color: black !important;
        }
        .btn-reset {
            background: linear-gradient(135deg, var(--sena-green) 0%, var(--sena-dark-green) 100%);
            border: none; border-radius: 10px; padding: 0.75rem 1rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="reset-card text-center">
                    {% if validlink %}
                        <i class="fas fa-key fa-3x mb-3" style="color: var(--sena-green);"></i>
                        <h2 class="mb-4 fw-bold">Establecer Nueva Contraseña</h2>
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary btn-reset w-100 mt-3">
                                <i class="fas fa-save me-2"></i>
                                Guardar nueva contraseña
                            </button>
                        </form>
                    {% else %}
                        <i class="fas fa-exclamation-triangle fa-3x mb-3 text-danger"></i>
                        <h2 class="mb-4 fw-bold">Error</h2>
                        <p>El enlace de restablecimiento es inválido, probablemente porque ya ha sido usado.</p>
                        <a href="{% url 'accounts:password_reset' %}" class="btn btn-secondary mt-3">Solicitar uno nuevo</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
