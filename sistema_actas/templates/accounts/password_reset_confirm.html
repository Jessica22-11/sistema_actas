{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio Exitoso | SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --sena-green: #39A900; 
            --sena-purple: #f8f8f8ff;
            --sena-blue: #ffffffff;
        }

        body {
            height: 100vh; /* ocupa toda la altura visible */
            margin: 0;
            background: linear-gradient(135deg, var(--sena-blue) 0%, var(--sena-purple) 100%) !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-done-card {
            background: white;
            color: #333;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            margin: auto; /* asegura centrado incluso si hay scroll */
        }

        .btn-login {
            background-color: var(--sena-green);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="reset-done-card">
        <i class="fas fa-check-circle fa-4x mb-4" style="color: var(--sena-green);"></i>
        <h2 class="mb-3 fw-bold">Contraseña Cambiada</h2>
        <p class="text-muted">
            Tu contraseña ha sido establecida correctamente. Ahora puedes iniciar sesión con tu nueva contraseña.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-login w-75 mt-3 text-white">
            <i class="fas fa-sign-in-alt me-1"></i>
            Ir a Iniciar Sesión
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
